[package]
name = "eternal-host"
version = "0.3.0"
edition = "2021"

[dependencies]
eternal-wire = { path = "../proto" }
ffmpeg-next = { version = "7", features = ["codec", "format", "software-scaling", "software-resampling"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# GUI
eframe = "0.31"

# QR code rendering for the "QR Code" modal in the GUI
qrcode = { version = "0.14", default-features = false }

# Settings persistence (%APPDATA%/EternalMonitor/settings.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"

# mDNS service advertisement
mdns-sd = "0.12"

# Shared state
parking_lot = "0.12"
once_cell = "1"

# Socket options (send-buffer sizing) before handing the socket to tokio
socket2 = "0.5"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
