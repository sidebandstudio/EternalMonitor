[package]
name = "eternal-host"
version = "0.3.2"
edition = "2021"

[dependencies]
eternal-wire = { path = "../proto" }
eternal-updater = { path = "../updater" }
ffmpeg-next = { version = "7", features = ["codec", "format", "software-scaling", "software-resampling"] }
libc = "0.2"
getrandom = { version = "0.3.4", features = ["std"] }
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# GUI
eframe = "0.36"

# QR code rendering for the "QR Code" modal in the GUI
qrcode = { version = "0.14", default-features = false }

# Settings persistence (%APPDATA%/EternalMonitor/settings.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
semver = "1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# SHA-256 of downloaded updates (already used by rustls)
ring = "0.17"

# mDNS service advertisement
mdns-sd = "0.13.11"

# Shared state
parking_lot = "0.12"
once_cell = "1"
regex = "1"

# Socket options (send-buffer sizing) before handing the socket to tokio
socket2 = "0.5"

[features]
# Lets a release build obey ETERNAL_SIMULATE_STARTUP_FAILURE, for native
# failure-path checks. Debug builds always do; shipped builds never do.
fault-injection = []

[build-dependencies]
winresource = "0.1"
cc = "1"
pkg-config = "0.3"

# Direct VideoToolbox encoder (encoder/videotoolbox): CF types for its FFI.
# Same version as the Mac spikes, so the lockfile carries one copy.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# CGEvent input (input/mac/cg.rs) and the private CGVirtualDisplay
# (virtual_display/mac.rs). Same versions as the Mac spikes.
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
# ScreenCaptureKit capture (capture/sck).
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
    "objc2-core-graphics",
    "SCError",
    "SCShareableContent",
    "SCStream",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGDisplayStream",
    "CGError",
    "CGWindow",
    "libc",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGSession",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
