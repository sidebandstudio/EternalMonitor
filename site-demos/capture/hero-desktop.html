<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero desktops</title>
  <!-- The screens of the home page hero, captured by capture-doc.sh at 2x.
         ?laptop&mode=mirror|second&link=usb|wifi
           The laptop's Windows desktop, 1571 x 864, the shape of the laptop
           render's display (1964 x 1080 at 125%):
           the app as it draws itself in that state (footage/hero-*.webp,
           capture-hero.sh) and, when mirroring, the reference sheet behind it.
         ?ipad
           The iPad as a second screen, 1440 x 993 (2420 x 1668 at 168%): the
           reference sheet moved onto it. Mirroring needs no picture of its
           own; the page shows the laptop's picture on the iPad, letterboxed. -->
  <style>
    @font-face { font-family: 'Geist'; font-weight: 400; src: url('../../docs/assets/fonts/Geist-Regular.woff2') format('woff2'); }
    html, body { margin: 0; }
    body { position: relative; overflow: hidden; background: #0b0e14 url('../art/wallpaper.webp') center / cover; font-family: 'Geist', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    body.laptop { width: 1571px; height: 864px; }
    body.ipad { width: 1440px; height: 993px; }
    .win { position: absolute; overflow: hidden; border-radius: 9px; background: #0e0e10; border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(0, 0, 0, 0.5); }
    .bar { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 12px; background: #0a0a0b; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 11px; color: #a1a1aa; }
    .bar.light { background: #e6e4df; border-bottom-color: rgba(0, 0, 0, 0.08); color: #4a4b50; }
    .bar .t { display: inline-flex; align-items: center; gap: 7px; }
    .bar .t img { width: 14px; height: 14px; border-radius: 4px; }
    .bar .wc { display: inline-flex; gap: 16px; }
    .bar .wc svg { width: 9px; height: 9px; }
    .win > img { display: block; }
    #app { left: 36px; top: 22px; width: 1040px; }
    #app .view { width: 1040px; height: 720px; overflow: hidden; }
    #app .view img { display: block; width: 1040px; height: 720px; }
    #doc > img { width: 760px; height: 780px; }
    .laptop #doc { left: 738px; top: 44px; }
    .second.laptop #doc { display: none; }
    .ipad #doc { left: 340px; top: 58px; }

    /* The Windows 11 taskbar: centred apps, the tray on the right. */
    .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(30, 31, 34, 0.94); border-top: 1px solid rgba(255, 255, 255, 0.07); color: #f2f2f3; }
    .apps { display: flex; gap: 4px; }
    .app { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 5px; }
    .app.on { background: rgba(255, 255, 255, 0.07); }
    .app.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: #9fa3ab; }
    .app.on.focus::after { background: #60cdff; }
    .app svg, .app img { width: 22px; height: 22px; }
    .app img { border-radius: 5px; }
    .tray { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 14px; font-size: 12px; }
    .tray svg { width: 16px; height: 16px; }
    .tray .icons { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
    .clock { text-align: right; line-height: 1.35; }
    .ipad .tray .icons, .ipad .chev { display: none; }
  </style>
</head>
<body>
  <div class="win" id="doc">
    <div class="bar light"><span class="t">Night coast references</span><span class="wc"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1 5h8"/></svg><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="7" height="7"/></svg><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></span></div>
    <img src="../footage/doc.png" alt="">
  </div>
  <div class="win" id="app">
    <div class="bar"><span class="t"><img src="../../docs/assets/icon.png" alt="">EternalMonitor</span><span class="wc"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1 5h8"/></svg><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="7" height="7"/></svg><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></span></div>
    <div class="view"><img id="app-still" alt=""></div>
  </div>

  <div class="taskbar">
    <div class="apps">
      <span class="app"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="9.4" height="9.4" rx="1" fill="#4cc2ff"/><rect x="11.6" y="1" width="9.4" height="9.4" rx="1" fill="#4cc2ff"/><rect x="1" y="11.6" width="9.4" height="9.4" rx="1" fill="#4cc2ff"/><rect x="11.6" y="11.6" width="9.4" height="9.4" rx="1" fill="#4cc2ff"/></svg></span>
      <span class="app"><svg viewBox="0 0 22 22" fill="none" stroke="#f2f2f3" stroke-width="1.8" stroke-linecap="round"><circle cx="9.5" cy="9.5" r="6"/><path d="M14 14l5 5"/></svg></span>
      <span class="app"><svg viewBox="0 0 22 22"><path d="M2 6.5a2 2 0 0 1 2-2h4.6l2 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#f4c24d"/><path d="M2 9h18v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#ffd866"/></svg></span>
      <span class="app on" id="t-app"><img src="../../docs/assets/icon.png" alt=""></span>
      <span class="app on" id="t-doc"><svg viewBox="0 0 22 22"><rect x="2" y="3.5" width="18" height="15" rx="2.5" fill="#e6e4df"/><path d="M4.5 15.5l4.2-4.6 3 3 2.2-2.2 3.6 3.8z" fill="#1d2a36"/><circle cx="14.6" cy="7.6" r="1.6" fill="#e0a65a"/></svg></span>
    </div>
    <div class="tray">
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="#f2f2f3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
      <span class="icons">
        <svg viewBox="0 0 16 16" fill="none" stroke="#f2f2f3" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.8 8.6a6.2 6.2 0 0 1 8.4 0M6.1 11.1a2.9 2.9 0 0 1 3.8 0"/><circle cx="8" cy="13.4" r="0.9" fill="#f2f2f3" stroke="none"/></svg>
        <svg viewBox="0 0 16 16" fill="none" stroke="#f2f2f3" stroke-width="1.4" stroke-linejoin="round"><path d="M2 6h3l4-3.2v10.4L5 10H2z"/><path d="M11.2 5.6a3.4 3.4 0 0 1 0 4.8M13 4a5.8 5.8 0 0 1 0 8" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 16 16" fill="none" stroke="#f2f2f3" stroke-width="1.3"><rect x="1" y="4.5" width="12.5" height="7" rx="1.8"/><rect x="2.6" y="6.1" width="7.4" height="3.8" rx="0.6" fill="#f2f2f3" stroke="none"/><path d="M15 7v2" stroke-linecap="round"/></svg>
      </span>
      <span class="clock">10:42 AM<br>10/30/2026</span>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const ipad = q.has('ipad');
    const mode = q.get('mode') || 'second';
    document.body.classList.add(ipad ? 'ipad' : 'laptop', mode);
    if (ipad) {
      document.getElementById('app').remove();
      document.getElementById('t-app').classList.remove('on');
    } else {
      document.getElementById('app-still').src = `../footage/hero-${mode}-${q.get('link') || 'usb'}.webp`;
      if (mode === 'second') document.getElementById('t-doc').classList.remove('on');
      document.getElementById('t-app').classList.add('focus');
    }
  </script>
</body>
</html>
