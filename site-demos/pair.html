<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=720, height=880">
  <title>Pair with a QR code</title>
  <link rel="stylesheet" href="shared.css">
  <script src="vendor/gsap.min.js"></script>
  <style>
    .bg { background-image: url('art/lake.webp'); background-position: 60% 40%; }
    #win { left: 20px; top: 100px; width: 680px; }
    #win .win-view { height: 530px; }
    #win .win-view > img { width: 1872px; left: -450px; top: -585px; }
    #shade { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); opacity: 0; }
    #dialog { position: absolute; left: 140px; top: 96px; width: 440px; opacity: 0; }
    #dialog img { width: 440px; display: block; border-radius: 26px; box-shadow: 0 50px 120px -30px rgba(0, 0, 0, 0.95); }
    #sweep {
      position: absolute; left: 80px; top: 156px; width: 280px; height: 4px;
      border-radius: 2px; background: #e8ff47; opacity: 0;
      box-shadow: 0 0 18px 4px rgba(232, 255, 71, 0.55);
    }
    #chip { left: 0; right: 0; top: 30px; margin: 0 auto; width: max-content; opacity: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="pair" data-start="0" data-width="720" data-height="880" data-duration="8">
    <div class="bg" id="bg"></div>
    <div class="bg-dim"></div>

    <div class="win" id="win">
      <div class="win-bar">
        <span class="t"><img src="ui/icon.png" alt="">EternalMonitor</span>
        <span class="wc"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1 5h8"/></svg><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="7" height="7"/></svg><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></span>
      </div>
      <div class="win-view">
        <img src="ui/hero-pc@2x.webp" alt="">
        <div id="shade"></div>
      </div>
    </div>

    <div id="dialog">
      <img src="ui/host-qr@2x.webp" alt="">
      <div id="sweep"></div>
    </div>

    <div class="chip" id="chip"><span class="dot"></span>iPad paired</div>

    <div class="ring" id="ring"></div>
    <div class="cursor" id="cursor"><svg viewBox="0 0 20 30"><path d="M1 1 L1 23 L6.4 18 L10 26.6 L13.6 25.1 L10.1 16.8 L17 16.8 Z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const REST = { x: 610, y: 560 };
    const QR_BTN = { x: 566, y: 247 };
    const DONE = { x: 372, y: 668 };

    // Background breathes once per loop and comes back to where it started.
    tl.fromTo('#bg', { scale: 1.06, x: 0 }, { scale: 1, x: -14, duration: 4, ease: 'sine.inOut' }, 0);
    tl.to('#bg', { scale: 1.06, x: 0, duration: 4, ease: 'sine.inOut' }, 4);
    tl.fromTo('#win', { y: 0 }, { y: -6, duration: 4, ease: 'sine.inOut' }, 0);
    tl.to('#win', { y: 0, duration: 4, ease: 'sine.inOut' }, 4);

    tl.set('#cursor', REST, 0);
    tl.to('#cursor', { ...QR_BTN, duration: 1.0, ease: 'power2.inOut' }, 0.3);
    const click = (at, p) => {
      tl.to('#cursor', { scale: 0.84, duration: 0.08, ease: 'power2.in', yoyo: true, repeat: 1, transformOrigin: '0 0' }, at);
      tl.set('#ring', { left: p.x, top: p.y }, at);
      tl.fromTo('#ring', { scale: 0.3, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.55, ease: 'power2.out', immediateRender: false }, at + 0.04);
    };
    click(1.45, QR_BTN);

    // The app's QR dialog opens over a dimmed window.
    tl.to('#shade', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 1.6);
    tl.to('#win', { scale: 0.965, duration: 0.6, ease: 'power3.out' }, 1.6);
    tl.fromTo('#dialog', { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'power3.out' }, 1.65);
    tl.to('#cursor', { x: 600, y: 470, duration: 0.8, ease: 'power2.inOut' }, 2.1);

    // Two passes of a scan line over the code, then the iPad is paired.
    [2.7, 3.75].forEach((at) => {
      tl.fromTo('#sweep', { y: 0, opacity: 0 }, { y: 282, duration: 0.95, ease: 'sine.inOut', immediateRender: at === 2.7 }, at);
      tl.to('#sweep', { opacity: 1, duration: 0.15 }, at);
      tl.to('#sweep', { opacity: 0, duration: 0.2 }, at + 0.75);
    });
    tl.fromTo('#chip', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 4.85);

    tl.to('#cursor', { ...DONE, duration: 0.85, ease: 'power2.inOut' }, 5.2);
    click(6.15, DONE);
    tl.to('#dialog', { opacity: 0, y: 18, scale: 0.96, duration: 0.4, ease: 'power2.in' }, 6.3);
    tl.to('#shade', { opacity: 0, duration: 0.45, ease: 'power2.out' }, 6.45);
    tl.to('#win', { scale: 1, duration: 0.6, ease: 'power3.out' }, 6.45);
    tl.to('#chip', { opacity: 0, y: -14, duration: 0.4, ease: 'power2.in' }, 6.7);
    tl.to('#cursor', { ...REST, duration: 1.1, ease: 'power2.inOut' }, 6.8);

    window.__timelines['pair'] = tl;
  </script>
</body>
</html>
