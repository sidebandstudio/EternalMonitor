<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=728, height=1040">
  <title>Pair with a QR code</title>
  <link rel="stylesheet" href="shared.css">
  <script src="vendor/gsap.min.js"></script>
  <script src="film.js"></script>
  <style>
    .bg { background-image: url('art/lake.webp'); background-position: 60% 40%; }
    /* The Windows app draws every frame of footage/host-pair.mp4 itself. */
    #win { left: 0; top: 0; width: 2080px; transform-origin: 0 0; }
    #win .win-view { width: 2080px; height: 1440px; }
    #win video { width: 2080px; height: 1440px; }
    #shade { position: absolute; inset: 0; background: rgba(6, 7, 10, 0.55); opacity: 0; }
    /* The iPad app, recorded in the simulator: Scan QR code, its real scanner
       (playing what the camera would see, capture/camera.html), then the
       stream. footage/ipad-pair.mp4 is the screen at 1112 x 1614. */
    #tab { left: 84px; top: 140px; width: 560px; height: 795px; border-radius: 44px; transform-origin: 50% 50%; }
    #tab .ipad-screen { left: 20px; top: 20px; width: 520px; height: 755px; border-radius: 26px; }
    #tab video { left: 0; top: 0; width: 520px; height: 755px; }
    #chip { left: 0; right: 0; top: 34px; margin: 0 auto; width: max-content; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="pair" data-start="0" data-width="728" data-height="1040" data-duration="8">
    <div class="bg" id="bg"></div>
    <div class="bg-dim"></div>

    <div class="win" id="win">
      <div class="win-bar">
        <span class="t"><img src="ui/icon.png" alt="">EternalMonitor</span>
        <span class="wc"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1 5h8"/></svg><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="1.5" width="7" height="7"/></svg><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></span>
      </div>
      <div class="win-view">
        <video id="app" src="footage/host-pair.mp4" data-start="0" data-duration="8" muted playsinline></video>
      </div>
    </div>
    <div id="shade"></div>

    <div class="ipad" id="tab">
      <div class="ipad-screen">
        <video id="pad" src="footage/ipad-pair.mp4" data-start="2.2" data-duration="5.7" muted playsinline></video>
        <div class="touch" id="touch"></div>
      </div>
    </div>

    <div class="chip" id="chip"><span class="dot"></span>iPad Pro connected over Wi-Fi</div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const AT = { x: 364, y: 440 };
    // The whole window; the Connect an iPad card and its QR code button; the
    // Scan to connect dialog; the streaming header and the connected iPad.
    const WHOLE = pose(520, 345, 0.66, AT);
    const CARD = pose(450, 300, 1.45, AT);
    const DIALOG = pose(520, 330, 1.3, { x: 364, y: 470 });
    const LIVE = pose(640, 250, 1.0, { x: 364, y: 330 });

    tl.fromTo('#bg', { scale: 1.06, x: 0 }, { scale: 1, x: -14, duration: 4, ease: 'sine.inOut' }, 0);
    tl.to('#bg', { scale: 1.06, x: 0, duration: 4, ease: 'sine.inOut' }, 4);

    // In the PC's footage the pointer clicks QR code at 1.17 s, the iPad joins
    // at 4.9 s, Done closes the dialog at 5.5 s and the iPad leaves at 7.8 s.
    // In the iPad's footage (from 2.2 s) the scanner opens at 3.0 s, reads the
    // code at 4.6 s and the stream is up at 4.75 s.
    tl.set('#win', WHOLE, 0);
    tl.to('#win', { ...CARD, duration: 1.0, ease: 'power2.inOut' }, 0.15);
    tl.to('#win', { ...DIALOG, duration: 0.75, ease: 'power3.inOut' }, 1.25);
    tl.to('#win', { ...LIVE, duration: 0.9, ease: 'power3.inOut' }, 5.25);
    tl.to('#win', { ...WHOLE, duration: 0.7, ease: 'power2.inOut' }, 7.3);

    // The iPad comes up in front of the PC, steps back to the corner once it
    // is connected, and leaves as the film loops.
    tl.fromTo('#tab', { y: 1000, rotation: 0, scale: 1 }, { y: 0, duration: 0.6, ease: 'power3.out', immediateRender: true }, 2.2);
    tl.to('#shade', { opacity: 1, duration: 0.5, ease: 'power1.out' }, 2.25);
    tl.to('#tab', { x: 200, y: 285, scale: 0.42, duration: 0.85, ease: 'power3.inOut' }, 5.3);
    tl.to('#shade', { opacity: 0, duration: 0.6, ease: 'power1.inOut' }, 5.35);
    tl.to('#tab', { y: 1100, duration: 0.55, ease: 'power2.in' }, 7.3);

    // A finger on Scan QR code.
    const SCAN = { x: 379 * 520 / 1112, y: 841 * 520 / 1112 };
    tl.set('#touch', { left: SCAN.x, top: SCAN.y }, 0);
    tl.fromTo('#touch', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.14, ease: 'power2.out', immediateRender: false }, 2.82);
    tl.to('#touch', { scale: 1.5, opacity: 0, duration: 0.4, ease: 'power2.out' }, 2.98);

    tl.fromTo('#chip', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out', immediateRender: true }, 4.95);
    tl.to('#chip', { opacity: 0, y: -14, duration: 0.4, ease: 'power2.in' }, 7.35);

    window.__timelines['pair'] = tl;
  </script>
</body>
</html>
