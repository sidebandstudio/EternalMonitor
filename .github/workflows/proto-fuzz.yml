name: Proto fuzz

# Builds the cargo-fuzz targets in proto/fuzz (the v3 protocol and the
# credential store), runs each target's checked-in regression inputs
# (proto/fuzz/regressions/<target>/), then runs each one briefly. Longer
# runs happen locally; this keeps the targets compiling and catches shallow
# crashes on every change to either crate.

on:
  pull_request:
    paths:
      - "proto/**"
      - "credstore/**"
      - ".github/workflows/proto-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly; pinned so a nightly regression can't fail CI.
  FUZZ_TOOLCHAIN: nightly-2026-11-06

jobs:
  fuzz:
    name: Proto fuzz targets (build, then 30 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto/fuzz
      - name: Install cargo-fuzz
        run: cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        working-directory: proto/fuzz
        run: cargo "+$FUZZ_TOOLCHAIN" fuzz build
      - name: Run each target for 30 s
        working-directory: proto/fuzz
        # The repository is public: libFuzzer's output names and encodes the
        # crashing input, so it goes to a file that is never printed or
        # uploaded. A crash is reported by target name only.
        run: |
          set -uo pipefail
          targets="credstore_formats credstore_ops v3_handshake v3_pairing v3_parsers v3_record_open v3_replay_window v3_session_sim"
          listed=$(cargo "+$FUZZ_TOOLCHAIN" fuzz list | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$listed" != "$targets" ]; then
            echo "::error::fuzz targets are '$listed', expected '$targets'"
            exit 1
          fi
          failed=0
          for target in $targets; do
            sanitizer=address
            # Safe Rust only; it runs far faster without the sanitizer.
            case "$target" in v3_session_sim | credstore_ops) sanitizer=none ;; esac
            log="$RUNNER_TEMP/fuzz-$target.log"
            # Checked-in regression inputs run first, each on its own.
            if [ -d "regressions/$target" ]; then
              for input in regressions/"$target"/*; do
                if ! cargo "+$FUZZ_TOOLCHAIN" fuzz run -s "$sanitizer" "$target" "$input" > "$log" 2>&1; then
                  echo "::error::regression $(basename "$input") fails in $target"
                  failed=1
                fi
              done
            fi
            if cargo "+$FUZZ_TOOLCHAIN" fuzz run -s "$sanitizer" "$target" -- -max_total_time=30 > "$log" 2>&1; then
              echo "$target: $(grep -E '^Done [0-9]+ runs' "$log" || echo 'finished')"
            else
              echo "::error::crash in $target, reproduce locally with cargo fuzz run $target"
              failed=1
            fi
          done
          exit "$failed"
