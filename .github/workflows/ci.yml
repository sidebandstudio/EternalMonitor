name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (linux, pure crates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check release version parity
        run: scripts/check-versions.sh
      - name: Test system measurement parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check -p eternal-wire
      - name: Test pure crates
        run: cargo test -p eternal-wire --locked

  rust-windows:
    name: Rust (windows, full host)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # ffmpeg-sys-next bindgen needs libclang; preinstalled LLVM on the runner image
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg 7.1.1 shared SDK
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: C:\ffmpeg
          key: ffmpeg-7.1.1-full_build-shared

      - name: Download FFmpeg 7.1.1 shared SDK
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build-shared.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg-extract | Out-Null
          Move-Item C:\ffmpeg-extract\ffmpeg-7.1.1-full_build-shared C:\ffmpeg

      - name: Configure FFmpeg environment
        shell: pwsh
        run: |
          "FFMPEG_DIR=C:\ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked

  rust-macos:
    name: Rust (macOS, full workspace + E2E)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg 7.1 SDK
        run: brew install ffmpeg@7 pkgconf
      - uses: Swatinem/rust-cache@v2
      - name: Lint workspace
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/ffmpeg@7/lib/pkgconfig
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace (includes synthetic end-to-end stream)
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/ffmpeg@7/lib/pkgconfig
        run: cargo test --workspace --locked

  ios-build:
    name: iOS (simulator build)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and streaming SDK
        run: |
          brew install xcodegen ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Create iPad simulator
        id: sim
        run: |
          DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB
          echo "Using device type: $DEVICE_TYPE"
          xcodebuild -version
          UDID=$(xcrun simctl create citest "$DEVICE_TYPE" com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run iOS unit and UI tests
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          scripts/test_ios.sh
      - name: Retain iOS test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-evidence
          path: |
            build/ios-tests-*.log
            build/ios-tests-*.xcresult
            build/ios-ui-host-*.log
            build/ios-ui-usb-host-*.log
            build/ios-ui-pairing-host-*.log
            build/ios-usb-proxy-*.log
            build/screenshots/ui-*
          retention-days: 7

  system-e2e:
    name: System E2E (simulator streaming)
    # Measure the real encoder and client together on a fresh runner.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the disposable streaming runner
        run: |
          # Indexing the SDK and build output competes with both software codecs.
          # This is a disposable CI VM, never a developer's machine.
          sudo mdutil -a -i off
          xcrun simctl list devices booted
          xcrun simctl shutdown all
      - name: Install XcodeGen and streaming SDK
        run: |
          brew install xcodegen ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Create iPad simulator
        id: sim
        run: |
          DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB
          xcodebuild -version
          UDID=$(xcrun simctl create cistream "$DEVICE_TYPE" com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          sysctl -n hw.model hw.ncpu hw.memsize
      - name: Run simulator streaming matrix
        env:
          EM_SIM_NAME: cistream
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p build/e2e
          vm_stat > build/e2e/vm-before.txt
          sysctl vm.swapusage >> build/e2e/vm-before.txt
          status=0
          scripts/e2e_matrix.sh --ci || status=$?
          vm_stat > build/e2e/vm-after.txt
          sysctl vm.swapusage >> build/e2e/vm-after.txt
          exit "$status"
      - name: Retain streaming evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-e2e-evidence
          path: |
            build/e2e-report.md
            build/e2e/
            build/screenshots/e2e-*.png
          retention-days: 7
