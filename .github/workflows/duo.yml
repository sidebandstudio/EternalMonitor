# iPhone Duo test builds for TestFlight: "EternalMonitor Duo Beta",
# com.eternal.monitor.duo. This file lives only on feat/iphone-duo and is
# deleted before the branch could ever merge.
name: iPhone Duo TestFlight

on:
  push:
    branches: [feat/iphone-duo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duo-testflight
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests on iPhone and iPad (Xcode 16.4)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # The toolchain main's CI uses, so the branch keeps building there.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create iPhone and iPad simulators
        id: sim
        run: |
          xcodebuild -version
          RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-18-6
          echo "iphone=$(python3 scripts/ci_simulator.py duo-iphone com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max $RUNTIME)" >> "$GITHUB_OUTPUT"
          echo "ipad=$(python3 scripts/ci_simulator.py duo-ipad com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB $RUNTIME)" >> "$GITHUB_OUTPUT"
      - name: Run unit tests on iPhone
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.iphone }}
          EM_TEST_STAMP: iphone
        run: scripts/test_ios.sh -only-testing:EternalMonitorTests
      - name: Run unit tests on iPad
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.ipad }}
          EM_TEST_STAMP: ipad
        run: scripts/test_ios.sh -only-testing:EternalMonitorTests
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-unit-tests-xcode-16.4
          path: |
            build/ios-tests-*.log
            build/ios-tests-*.xcresult
          retention-days: 14

  duo-simulator-tests:
    name: Unit and UI tests on the iPhone Duo simulator (Xcode 27.1)
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen, the streaming SDK and Rust
        run: |
          brew install xcodegen ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
          if ! command -v cargo; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Install the Metal toolchain if this Xcode lacks it
        run: xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Create an iPhone Duo simulator
        id: sim
        run: |
          xcodebuild -version
          # keepsNavigationBar() needs the Swift that ships with the iOS 27 SDK.
          xcrun swift --version
          read -r DEVICE_TYPE RUNTIME < <(python3 - <<'PY'
          import json,subprocess,sys
          def listing(kind): return json.loads(subprocess.check_output(['xcrun','simctl','list',kind,'-j']))[kind]
          types=listing('devicetypes'); runtimes=listing('runtimes')
          duo=[t for t in types if t['name']=='iPhone Duo']
          ios=[r for r in runtimes if r['platform']=='iOS' and r['isAvailable'] and r['version'].startswith('27.1')]
          if not duo or not ios:
              sys.exit('No iPhone Duo or iOS 27.1: '+', '.join(t['name'] for t in types if 'iPhone' in t['name'])
                       +' / '+', '.join(r['version'] for r in runtimes if r['platform']=='iOS'))
          print(duo[0]['identifier'], ios[-1]['identifier'])
          PY
          )
          echo "Using $DEVICE_TYPE on $RUNTIME"
          echo "udid=$(python3 scripts/ci_simulator.py duo-sim "$DEVICE_TYPE" "$RUNTIME")" >> "$GITHUB_OUTPUT"
      - name: Fold the iPhone Duo closed
        # Other tests expect the iPhone-sized outer screen; the fold tests
        # open and close it themselves. Nothing public folds the simulator.
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p build
          xcrun -sdk iphonesimulator clang -arch arm64 -mios-simulator-version-min=17.0 -fobjc-arc \
            -DEM_HINGE_TOOL -framework Foundation -o build/duo-hinge ios/EternalMonitorUITests/DuoHinge.m
          codesign -f -s - build/duo-hinge
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" "$PWD/build/duo-hinge" 0
          xcrun devicectl device info displays -d "$UDID" || true
      - name: Run unit tests on iPhone Duo
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
          EM_TEST_STAMP: iphone-duo
        run: scripts/test_ios.sh -only-testing:EternalMonitorTests
      - name: Fold and unfold the iPhone Duo while it connects, pairs and streams
        if: ${{ !cancelled() }}
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
          EM_TEST_STAMP: iphone-duo-fold
        run: scripts/test_ios.sh -only-testing:EternalMonitorUITests/DuoFoldTests
      - name: Keep the app's diagnostics log from the fold tests
        if: ${{ !cancelled() }}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p build/duo-app-log
          DATA=$(xcrun simctl get_app_container "$UDID" com.eternal.monitor data)
          cp "$DATA/Library/Application Support/Diagnostics/"eternal-ipad.log* build/duo-app-log/ || true
      # The same groups the iPad runs (scripts/e2e_stream_ui.sh, then the
      # rest), so a saved host or setting from one can't change the other.
      - name: Run the streaming UI tests on the folded iPhone Duo
        if: ${{ !cancelled() }}
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
          EM_TEST_STAMP: iphone-duo-stream
        run: |
          scripts/test_ios.sh -only-testing:EternalMonitorUITests/AudioStreamTests \
            -only-testing:EternalMonitorUITests/StreamDiagnosticsTests \
            -only-testing:EternalMonitorUITests/USBStreamTests -only-testing:EternalMonitorUITests/HUDHideTests
      - name: Run the other UI tests on the folded iPhone Duo
        if: ${{ !cancelled() }}
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
          EM_TEST_STAMP: iphone-duo-ui
        run: |
          scripts/test_ios.sh -only-testing:EternalMonitorUITests -skip-testing:EternalMonitorUITests/DuoFoldTests \
            -skip-testing:EternalMonitorUITests/AudioStreamTests -skip-testing:EternalMonitorUITests/StreamDiagnosticsTests \
            -skip-testing:EternalMonitorUITests/USBStreamTests -skip-testing:EternalMonitorUITests/HUDHideTests
      # Screenshots of both screens. Only synthetic content is on them; the
      # PNGs keep pixel chunks only and are checked for secret values first.
      - name: Collect the fold screenshots
        if: ${{ !cancelled() }}
        run: python3 scripts/duo_evidence.py screens build/screenshots/ui-iphone-duo-fold build/duo-screens
      - name: Check the evidence for secret values
        id: scan
        if: ${{ !cancelled() }}
        env:
          ETERNAL_DIAGNOSTICS_ENDPOINT: ${{ secrets.ETERNAL_DIAGNOSTICS_ENDPOINT }}
          ETERNAL_DIAGNOSTICS_INGEST_KEY: ${{ secrets.ETERNAL_DIAGNOSTICS_INGEST_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DUO_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_DUO_PROVISION_PROFILE_BASE64 }}
        run: python3 scripts/duo_evidence.py scan build/duo-screens build/duo-app-log build/ios-tests-*.log build/ios-tests-*.xcresult build/ios-ui-*.log
      - name: Retain the fold screenshots
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: duo-screens-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/duo-screens/
          retention-days: 14
      - name: Retain test evidence
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: duo-tests-xcode-27.1
          path: |
            build/ios-tests-*.log
            build/ios-tests-*.xcresult
            build/ios-ui-*.log
            build/duo-app-log/
          retention-days: 14

  archive:
    name: Archive and upload to EternalMonitor Duo Beta (Xcode 27.1)
    # Only this branch signs and uploads, even from a manual dispatch.
    if: github.ref == 'refs/heads/feat/iphone-duo'
    runs-on: xcode-27
    timeout-minutes: 100
    env:
      # The iOS 27.1 SDK is what lets the app fill both iPhone Duo screens.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      DUO_MIN_SDK: "27.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The upload is skipped when nothing in the app changed since the
          # newest build's commit, which can be any earlier commit.
          fetch-depth: 0
      - name: Install XcodeGen and the App Store Connect client
        run: |
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet 'pyjwt[crypto]'
          echo "DUO_PYTHON=$RUNNER_TEMP/asc/bin/python" >> "$GITHUB_ENV"
      - name: Install the Metal toolchain if this Xcode lacks it
        run: xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Archive, upload, and prepare the build for Duo internal
        # The build number is one above App Store Connect's highest. When
        # only CI, scripts, docs or tests changed, nothing is uploaded.
        env:
          ETERNAL_DIAGNOSTICS_ENDPOINT: ${{ secrets.ETERNAL_DIAGNOSTICS_ENDPOINT }}
          ETERNAL_DIAGNOSTICS_INGEST_KEY: ${{ secrets.ETERNAL_DIAGNOSTICS_INGEST_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DUO_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_DUO_PROVISION_PROFILE_BASE64 }}
        run: scripts/duo-testflight.sh
      # The repository is public, and artifact files are not masked like the
      # job log. Build logs hold the diagnostics settings, so they stay on the
      # runner; the evidence is the facts the scripts wrote, checked first.
      - name: Check the evidence for secret values
        id: scan
        if: always()
        env:
          ETERNAL_DIAGNOSTICS_ENDPOINT: ${{ secrets.ETERNAL_DIAGNOSTICS_ENDPOINT }}
          ETERNAL_DIAGNOSTICS_INGEST_KEY: ${{ secrets.ETERNAL_DIAGNOSTICS_INGEST_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_DUO_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_DUO_PROVISION_PROFILE_BASE64 }}
        run: python3 scripts/duo_evidence.py scan build/duo-testflight/archive-info.json build/duo-testflight/asc.json build/duo-testflight/result.json
      - name: Retain build evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EternalMonitor-Duo-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/duo-testflight/archive-info.json
            build/duo-testflight/asc.json
            build/duo-testflight/result.json
          retention-days: 14
      - name: Summarize the result
        if: success()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads(pathlib.Path('build/duo-testflight/result.json').read_text())
          if result['mode']=='skipped':
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write(f"No new Duo build: {result['reason']}.\n")
              raise SystemExit
          archive=result['archive']; asc=result.get('app_store_connect',{})
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"EternalMonitor Duo {result['version']} ({result['build']}): {result['mode']} passed.\n\n")
              out.write(f"SDK {archive['DTSDKName']}, Xcode {archive['DTXcode']}, minimum iOS {archive['MinimumOSVersion']}.\n\n")
              if asc:
                  out.write(f"App Store Connect: {asc['processing_state']}, internal testing {asc['internal_build_state']}, "
                            f"in Duo internal: {asc['in_duo_internal']}.\n")
          PY
